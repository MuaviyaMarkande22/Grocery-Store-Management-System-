                </div>
              </div>
            </div>
          )}

          {/* DYNAMIC UPI QR MODAL */}
          {isUpiModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-200 dark:border-slate-800 relative">
                <button 
                  onClick={() => setIsUpiModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2"
                >
                  ✕
                </button>

                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white font-black text-lg flex items-center justify-center mx-auto mb-2">
                  MG
                </div>
                <h3 className="font-black text-lg text-slate-900 dark:text-white">Scan &amp; Pay via UPI</h3>
                <p className="text-xs text-slate-400 mb-4">Pay securely with Google Pay, PhonePe, Paytm or BHIM</p>

                {/* QR Canvas Box */}
                <div className="p-4 bg-white rounded-3xl border-2 border-emerald-500/30 shadow-lg inline-block mx-auto mb-4">
                  <div ref={qrCodeRef} className="w-[210px] h-[210px] flex items-center justify-center"></div>
                </div>

                <div className="bg-slate-50 dark:bg-slate-800/60 p-3 rounded-2xl text-xs space-y-1 mb-4 border border-slate-200 dark:border-slate-700">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Merchant VPA:</span>
                    <span className="font-mono font-bold text-slate-900 dark:text-white">mgmart@okhdfcbank</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Amount Due:</span>
                    <span className="font-black text-emerald-500 text-sm">₹{cartTotal.toFixed(2)}</span>
                  </div>
                </div>

                {/* Simulate Payment Completion Button */}
                <button
                  onClick={() => completeOrder("UPI DYNAMIC QR")}
                  className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow-lg transition-all"
                >
                  Simulate Successful UPI Scan &amp; Pay
                </button>
              </div>
            </div>
          )}

          {/* USER AUTH MODAL */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200 dark:border-slate-800 relative">
                <button 
                  onClick={() => setIsAuthOpen(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2"
                >
                  ✕
                </button>

                <div className="text-center mb-6">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 via-emerald-500 to-teal-400 text-white font-black text-xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-emerald-500/25">
                    MG
                  </div>
                  <h3 className="text-2xl font-black text-slate-900 dark:text-white">
                    {authTab === 'signup' ? 'Create MG Mart Account' : 'Welcome to MG Mart'}
                  </h3>
                  <p className="text-xs text-slate-400 mt-1">
                    Unlock exclusive member pricing and dynamic UPI checkout
                  </p>
                </div>

                {/* Switcher */}
                <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl mb-5 text-xs font-bold">
                  <button
                    onClick={() => setAuthTab('signin')}
                    className={`flex-1 py-2 rounded-xl transition-all ${authTab === 'signin' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow font-black' : 'text-slate-400'}`}
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => setAuthTab('signup')}
                    className={`flex-1 py-2 rounded-xl transition-all ${authTab === 'signup' ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow font-black' : 'text-slate-400'}`}
                  >
                    New Registration
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  {authTab === 'signup' && (
                    <input
                      type="text"
                      placeholder="Full Name (e.g. Muaviya Markande)"
                      className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs"
                    />
                  )}
                  <input
                    type="email"
                    placeholder="Email Address (e.g. muaviya@example.com)"
                    defaultValue="customer@mgmart.com"
                    className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs"
                  />
                  <input
                    type="password"
                    placeholder="Password"
                    defaultValue="password123"
                    className="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs"
                  />

                  <button
                    onClick={() => setIsAuthOpen(false)}
                    className="w-full py-3.5 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-extrabold text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-emerald-500/25 mt-2"
                  >
                    {authTab === 'signup' ? 'Create Account' : 'Sign In Now'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* STORE MANAGEMENT / ADMIN PANEL MODAL */}
          {isAdminOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-800 relative max-h-[90vh] flex flex-col">
                <button 
                  onClick={() => setIsAdminOpen(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2"
                >
                  ✕
                </button>

                <div className="flex items-center gap-3 mb-6">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-500 text-white flex items-center justify-center font-bold">
                    📦
                  </div>
                  <div>
                    <h3 className="text-xl font-black text-slate-900 dark:text-white">MG Mart Store Management Console</h3>
                    <p className="text-xs text-slate-400">Live Inventory control &amp; Flash Sale configuration</p>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-slate-200 dark:border-slate-800 text-slate-400 font-bold uppercase text-[10px] tracking-wider">
                        <th className="py-2.5">Item</th>
                        <th className="py-2.5">Category</th>
                        <th className="py-2.5">MRP / MG Mart Price</th>
                        <th className="py-2.5">Origin</th>
                        <th className="py-2.5">Stock</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      {products.map(p => (
                        <tr key={p.id}>
                          <td className="py-2.5 flex items-center gap-2">
                            <img src={p.imageUrl} alt="" className="w-8 h-8 rounded-lg object-cover" />
                            <span className="font-bold text-slate-900 dark:text-slate-100">{p.name}</span>
                          </td>
                          <td className="py-2.5 text-slate-500">{p.categoryName}</td>
                          <td className="py-2.5">
                            <span className="line-through text-slate-400 mr-1.5">₹{p.mrpPrice}</span>
                            <span className="text-emerald-500 font-bold">₹{p.dmartPrice}</span>
                          </td>
                          <td className="py-2.5 text-slate-400">{p.originCountry || 'India'}</td>
                          <td className="py-2.5 font-bold">{p.stockQuantity}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ORDER SUCCESS CELEBRATION MODAL */}
          {orderSuccess && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border border-slate-200 dark:border-slate-800 relative">
                <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-emerald-500 to-teal-400 text-white flex items-center justify-center mx-auto mb-4 shadow-xl shadow-emerald-500/25">
                  <svg className="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"></path></svg>
                </div>

                <h3 className="text-2xl font-black text-slate-900 dark:text-white mb-1.5">
                  Order Confirmed!
                </h3>
                <p className="text-xs text-slate-400 mb-6">
                  Thank you for shopping with MG Mart. Your order is scheduled for priority dispatch.
                </p>

                <div className="bg-slate-50 dark:bg-slate-800/60 p-4 rounded-2xl text-left text-xs space-y-2 mb-6 border border-slate-200 dark:border-slate-700">
                  <div className="flex justify-between">
                    <span className="text-slate-400">Order ID:</span>
                    <span className="font-mono font-bold text-slate-900 dark:text-white">{orderSuccess.orderNumber}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Payment Status:</span>
                    <span className="font-bold text-emerald-500">PAID &amp; SETTLED</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-400">Payment Mode:</span>
                    <span className="font-semibold text-slate-700 dark:text-slate-300">{orderSuccess.paymentMethod}</span>
                  </div>
                  <div className="flex justify-between border-t border-slate-200 dark:border-slate-700 pt-2">
                    <span className="font-bold text-slate-900 dark:text-white">Total Amount Paid:</span>
                    <span className="font-black text-emerald-500 text-base">₹{Number(orderSuccess.amount).toFixed(2)}</span>
                  </div>
                </div>

                <button
                  onClick={() => setOrderSuccess(null)}
                  className="w-full py-3.5 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-extrabold text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-emerald-500/25 transition-all"
                >
                  Continue Shopping
                </button>
              </div>
            </div>
          )}

          {/* SLEEK BOUTIQUE FOOTER */}
          <footer className="bg-white/80 dark:bg-slate-925/80 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800/80 pt-16 pb-12 transition-colors mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              {/* Trust Value Propositions */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6 pb-12 border-b border-slate-200/80 dark:border-slate-800/80 text-center md:text-left">
                <div className="flex flex-col md:flex-row items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center flex-shrink-0 shadow-sm border border-amber-200/60 dark:border-amber-800/40">
                    <span className="text-xl">🌾</span>
                  </div>
                  <div>
                    <div className="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white">100% Desi &amp; Farm Pure</div>
                    <div className="text-[11px] text-slate-500 dark:text-slate-400">Direct Chakki Atta &amp; Agmark Dals</div>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0 shadow-sm border border-blue-200/60 dark:border-blue-900/40">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                  </div>
                  <div>
                    <div className="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white">Express Delivery</div>
                    <div className="text-[11px] text-slate-500 dark:text-slate-400">Complimentary on carts above ₹500</div>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-violet-50 dark:bg-violet-950/60 text-violet-600 dark:text-violet-400 flex items-center justify-center flex-shrink-0 shadow-sm border border-violet-200/60 dark:border-violet-900/40">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                  </div>
                  <div>
                    <div className="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white">Instant Doorstep Returns</div>
                    <div className="text-[11px] text-slate-500 dark:text-slate-400">Zero questions asked refund policy</div>
                  </div>
                </div>

                <div className="flex flex-col md:flex-row items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center flex-shrink-0 shadow-sm border border-emerald-200/60 dark:border-emerald-900/40">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                  </div>
                  <div>
                    <div className="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white">Instant UPI &amp; Cards</div>
                    <div className="text-[11px] text-slate-500 dark:text-slate-400">Dynamic QR &amp; PCI tokenized cards</div>
                  </div>
                </div>
              </div>

              {/* Bottom Copyright & Badges */}
              <div className="pt-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white font-black text-sm flex items-center justify-center">
                    MG
                  </div>
                  <span>&copy; {new Date().getFullYear()} MG Mart Supercenter. Powered by Spring Boot 3 &amp; React 18.</span>
                </div>

                <div className="flex items-center gap-2 text-[11px] font-bold">
                  <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700">UPI 2.0</span>
                  <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700">GPay</span>
                  <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700">PhonePe</span>
                  <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700">RuPay</span>
                  <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700">Visa / MC</span>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
